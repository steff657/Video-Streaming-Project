{% extends "core/base.html" %}

{% block title %}Sign Out{% endblock %}

{% block content %}
<section class="auth-shell container py-5">
  <div class="auth-card mx-auto text-center">
    <h1 class="h3 mb-3">Sign Out</h1>
    <p class="text-muted mb-4">Are you sure you want to sign out?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
      {% endif %}
      <button class="btn btn-danger" type="submit">Sign Out</button>
      <a href="{% url 'index' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
