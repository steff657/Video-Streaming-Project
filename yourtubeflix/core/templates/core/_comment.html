<div class="media mb-3" id="comment-{{ comment.id }}">
  <div class="me-2">
    <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width:40px;height:40px;">
      {{ comment.user.username|first|upper }}
    </div>
  </div>
  <div class="media-body">
    <h6 class="mt-0 mb-1">{{ comment.user.username }} <small class="text-muted">• {{ comment.created_at }}</small></h6>
    {% if comment.is_deleted %}
      <em class="text-muted">Comment deleted</em>
    {% else %}
      <p>{{ comment.comment_text|linebreaksbr }}</p>
    {% endif %}
    {% if user.is_authenticated and comment.user == user and not comment.is_deleted %}
      <button class="btn btn-sm btn-link text-danger delete-comment-btn" data-comment-id="{{ comment.id }}">Delete</button>
    {% endif %}
  </div>
</div>
