{% extends "core/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<section class="hero">
  <div class="container text-center px-3">
    <h1 class="display-3 fw-bold">🎉 Welcome to YourTubeFlix!</h1>
    <p class="lead mb-3">Share and discover amazing videos with our community.</p>
    <p class="h5">Built with <span class="fw-semibold">Django</span> and <span class="fw-semibold">Bootstrap 5</span></p>
    <div class="mt-4 d-flex flex-wrap justify-content-center gap-2">
      <a class="btn btn-light btn-lg" href="{% url 'upload_video' %}">📹 Upload Video</a>
      <a class="btn btn-outline-light btn-lg" href="{% url 'my_videos' %}">🎬 My Videos</a>
      <a class="btn btn-outline-light btn-lg" href="{% url 'admin:index' %}">⚙️ Admin</a>
    </div>
  </div>
</section>
{% endblock %}
