{% extends 'core/base.html' %}

{% block title %}Delete Video{% endblock %}

{% block content %}
<div class="container py-5">
  <h2>Delete: {{ video.title }}</h2>
  <p>Are you sure you want to permanently delete this video?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'my_videos' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
