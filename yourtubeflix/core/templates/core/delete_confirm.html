{% extends 'core/base.html' %}

{% load static %}

<link rel="stylesheet" href="{% static 'yourtubeflix\core\static\core\site.css' %}">


{% block title %}Delete Video{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="delete-section">
        <h2>Delete: {{ video.title }}</h2>
        <p>Are you sure you want to permanently delete this video?</p>
        <div class="delete-button-group">
          <form method="post" style="flex: 1;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100">Yes, delete</button>
          </form>
          <a href="{% url 'my_videos' %}" class="btn btn-secondary w-100">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
