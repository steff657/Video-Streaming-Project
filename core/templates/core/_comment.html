<div class="media mb-3" id="comment-{{ comment.id }}">
  <div>
    <div class="comment-avatar">
      <strong>{{ comment.user.username|first|upper }}</strong>
    </div>
  </div>
  <div class="media-body">
    <h6 class="mt-0 mb-1">
      {{ comment.user.username }}
      <small class="text-muted">• {{ comment.created_at }}</small>
    </h6>
    {% if comment.is_deleted %}
      <em class="text-muted">Comment deleted</em>
    {% else %}
      <p class="mb-2">{{ comment.comment_text|linebreaksbr }}</p>
    {% endif %}
    {% if user.is_authenticated and comment.user == user and not comment.is_deleted %}
      <button class="btn btn-sm btn-link edit-comment-btn p-0 me-2" data-comment-id="{{ comment.id }}" data-comment-text="{{ comment.comment_text|escapejs }}">Edit</button>
      <button class="btn btn-sm btn-link text-danger delete-comment-btn p-0" data-comment-id="{{ comment.id }}">Delete</button>
    {% endif %}
  </div>
</div>
