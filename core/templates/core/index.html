{% extends "core/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="container py-4 py-md-5">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="mb-0" id="search-results-title">
      {% if search_query %}
        Search results for "{{ search_query }}"
      {% else %}
        Recently Uploaded
      {% endif %}
    </h2>
  </div>
  <div id="yt-video-results">
    {% include "core/_video_grid.html" with videos=videos %}
  </div>
</div>
<script>
(function () {
  function formatDuration(totalSeconds) {
    if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '--:--';
    const seconds = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
    const minutes = Math.floor((totalSeconds / 60) % 60).toString().padStart(2, '0');
    const hours = Math.floor(totalSeconds / 3600);
    return hours > 0 ? `${hours}:${minutes}:${seconds}` : `${Math.floor(totalSeconds / 60)}:${seconds}`;
  }

  window.initVideoDurations = function initVideoDurations(root) {
    const scope = root || document;
    const badges = scope.querySelectorAll('.yt-duration-badge[data-video-url]');
    badges.forEach((badge) => {
      const src = badge.getAttribute('data-video-url');
      if (!src) return;

      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.src = src;

      probe.onloadedmetadata = function () {
        badge.textContent = formatDuration(probe.duration);
        probe.removeAttribute('src');
        probe.load();
      };

      probe.onerror = function () {
        badge.textContent = '--:--';
      };
    });
  };

  window.initVideoDurations(document);
})();
</script>
{% endblock %}
