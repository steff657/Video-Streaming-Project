<div class="yt-video-grid">
  {% for v in videos %}
  <article class="yt-video-card">
    <a href="{% url 'video_detail' v.pk %}" class="yt-thumb-wrap">
      {% if v.thumbnail %}
        <img src="{{ v.thumbnail.url }}" class="yt-thumb" alt="{{ v.title }}">
      {% else %}
        <div class="yt-thumb yt-thumb-fallback">
          <i class="fa-solid fa-play"></i>
        </div>
      {% endif %}
      <span class="yt-duration-badge" data-video-url="{{ v.video_file.url }}">--:--</span>
    </a>
    <div class="yt-video-body">
      <div class="yt-video-info">
        <span class="yt-channel-avatar">{{ v.owner.username|first|upper }}</span>
        <div class="yt-video-meta-copy">
          <h3 class="yt-video-title">
            <a href="{% url 'video_detail' v.pk %}">{{ v.title }}</a>
          </h3>
          <p class="yt-video-channel mb-1">{{ v.owner.username }}</p>
          <p class="yt-video-meta mb-0">{{ v.created_at|date:"M j, Y" }}</p>
        </div>
      </div>
      <div class="yt-video-actions">
        <a href="{% url 'video_detail' v.pk %}" class="btn btn-sm btn-outline-secondary">Watch</a>
      </div>
    </div>
  </article>
  {% empty %}
  <div class="yt-empty-state">
    <p class="mb-0">No videos found.</p>
  </div>
  {% endfor %}
</div>
